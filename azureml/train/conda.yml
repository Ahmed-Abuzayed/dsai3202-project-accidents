# The Python packages train.py imports, with direct dependencies pinned.
# This is the overlay on top of the Docker image named in environment.yml.
# Copied from Lab-8 (only the name changed). Each job also records its resolved environment.
name: accidents-env
channels:
  - conda-forge
dependencies:
  - python=3.11.9
  - numpy=1.26.4
  - scipy=1.13.1
  - scikit-learn=1.5.2
  - pandas=2.2.3
  - pyarrow=17.0.0
  - pip=24.2
  - pip:
      - mlflow==2.17.2
      - azureml-mlflow==1.58.0
      - adlfs==2024.7.0
