# Copied from Lab-10 (only the name changed).
# What score.py imports, pinned to the versions the model was trained with,
# plus the one package that turns a script into an HTTP server.
# No pyarrow, no adlfs, no azureml-mlflow: nothing here reads the lake.
name: accidents-inference
channels:
  - conda-forge
dependencies:
  - python=3.11.9
  - numpy=1.26.4
  - scipy=1.13.1
  - pip=24.2
  - scikit-learn=1.5.2
  - pandas=2.2.3
  - pip:
      - mlflow==2.17.2
      - azureml-inference-server-http==1.3.4
      - werkzeug==3.0.6   # 3.1 dropped werkzeug.__version__; the server then logs a harmless traceback at start
